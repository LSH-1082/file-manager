spring:
  datasource:
    url: jdbc:h2:mem:fileManager;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  servlet:
    multipart:
      max-file-size: 1KB   # 413 확인용
      max-request-size: 3KB
fileManager:
  storage-root: build/test-storage
